name: ParcelTrack Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  automated-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: parcel_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: testroot
      DB_NAME: parcel_db
      TEST_DB_NAME: parcel_db_test
      TEST_LOGIN_PASSWORD: TestPass123!
      SESSION_SECRET: parceltrack-ci-only-secret
      NODE_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and HTTP integration tests
        run: npm test

      - name: Run isolated MySQL workflow tests
        run: npm run test:db
